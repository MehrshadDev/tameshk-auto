name: tameshk

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            network: host
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                HTTP_PROXY: '${HTTP_PROXY:-}'
                HTTPS_PROXY: '${HTTPS_PROXY:-}'
                http_proxy: '${http_proxy:-}'
                https_proxy: '${https_proxy:-}'
        image: tameshk/sail-8.5-app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            sail: {}
            global-proxy-network:
                aliases:
                    - localhost-app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        ports:
            - '127.0.0.1:3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
            - ./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    redis:
        image: redis:8-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '127.0.0.1:8025:8025'
        networks:
            - sail
        restart: unless-stopped

    sail-worker:
        image: tameshk/sail-8.5-app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
        restart: unless-stopped

    sail-scheduler:
        image: tameshk/sail-8.5-app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan schedule:work
        restart: unless-stopped

networks:
    sail:
        driver: bridge
    global-proxy-network:
        external: true
        name: global-proxy-network

volumes:
    mysql-data:
        name: tameshk-mysql-data
    redis-data:
        name: tameshk-redis-data
